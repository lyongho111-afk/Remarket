spring.application.name=campus-remarket-mybatis
#server.address=127.0.0.1
server.port=8080
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 배포 환경에 맞게 DDL 설정 (기존 데이터 유지 시 update, 초기화 시 create 등)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8


#spring.datasource.driver-class-name=org.h2.Driver
#spring.sql.init.schema-locations=classpath:schema.sql,classpath:payment-schema.sql,classpath:escrow-simulation.sql,classpath:toss-test-payout.sql
#spring.sql.init.data-locations=classpath:data.sql
#spring.sql.init.encoding=UTF-8
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
mybatis.type-aliases-package=com.campus.remarket.dto
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

spring.jackson.time-zone=Asia/Seoul
integrations.google-maps-key=${GOOGLE_MAPS_API_KEY:}
integrations.toss-client-key=${TOSS_CLIENT_KEY:}
integrations.toss-secret-key=${TOSS_SECRET_KEY:}

# 회원 모듈: 기존 MyBatis DB와 같은 DataSource 사용, 회원 엔티티만 생성
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=true
server.error.include-message=always
campus.mail.mock=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# v10 actual member login integration: no demo fallback
campus.demo-user-enabled=false
campus.demo-campus.enabled=${CAMPUS_DEMO_DATA_ENABLED:true}
campus.rating.good-delta=1
campus.rating.bad-delta=-1

# v14 external notification delivery: explicitly enable after configuring services.
campus.notifications.enabled=${NOTIFICATIONS_ENABLED:false}
campus.notifications.solapi-key=${SOLAPI_API_KEY:}
campus.notifications.solapi-secret=${SOLAPI_API_SECRET:}
campus.notifications.solapi-url=https://api.solapi.com/messages/v4/send-many/detail
campus.notifications.sms-from=${SMS_FROM:}
campus.notifications.kakao-pf-id=${KAKAO_PF_ID:}
campus.notifications.kakao-template-id=${KAKAO_TEMPLATE_ID:}
campus.notifications.mail-from=${MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=${SMTP_SSL_CHECK_SERVER_IDENTITY:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Original teammate signup upload settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
campus.upload-dir=./uploads
server.tomcat.max-part-count=20

campus.geocoding.kakao-key=${KAKAO_REST_API_KEY:}
