<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로컬 테스트 수신함 · 캠퍼스 리마켓</title><style>
body{margin:0;background:#f5f8f3;color:#213f32;font:16px/1.6 system-ui,sans-serif}main{max-width:800px;margin:48px auto;padding:0 22px}h1{font-size:28px}a{color:#24694f}button{background:#24694f;color:white;border:0;border-radius:12px;padding:10px 18px;cursor:pointer}.notice,article{background:white;border:1px solid #dbe5d7;border-radius:18px;padding:22px;margin:18px 0}.notice{background:#fff8df}h2{font-size:18px;margin:0 0 8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}small{color:#65766b}</style></head><body><main>
<a href="/login.html">← 로그인 화면</a><h1>로컬 테스트 수신함</h1><p class="notice">인증번호와 거래 약속 메일을 이 컴퓨터에서만 확인합니다. 실제 이메일·문자·카카오톡은 발송되지 않습니다. 재실행하면 테스트 데이터와 메일이 초기화됩니다.</p><button id="refresh" type="button">새로고침</button><p id="status" role="status"></p><section id="messages" aria-label="테스트 메일"></section>
<script>
async function refresh(){const status=document.querySelector('#status');try{const r=await fetch('/api/local-demo/mailbox',{cache:'no-store'});if(!r.ok)throw Error('로컬 테스트 실행에서만 수신함을 볼 수 있습니다.');const data=await r.json();document.querySelector('#messages').replaceChildren(...data.messages.map(m=>{const a=document.createElement('article'),h=document.createElement('h2'),s=document.createElement('small'),p=document.createElement('pre');h.textContent=m.subject;s.textContent='받는 주소: '+m.to+' · '+new Date(m.receivedAt).toLocaleString('ko-KR');p.textContent=m.body;a.append(h,s,p);return a}));status.textContent=data.messages.length?'총 '+data.messages.length+'개':'아직 메일이 없습니다. 로그인 화면에서 인증번호를 요청해 보세요.'}catch(e){status.textContent=e.message}}
document.querySelector('#refresh').onclick=refresh;refresh();setInterval(()=>{if(!document.hidden)refresh()},5000);
</script></main></body></html>
