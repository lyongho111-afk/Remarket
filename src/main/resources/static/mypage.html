<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>계정 설정 · 캠퍼스 리마켓</title><link rel="stylesheet" href="style.css">
<style>
/* 계정 설정 화면 꾸밈 (이 화면에서만 쓰는 스타일) */
.acc{max-width:920px;margin:0 auto;padding:10px 0 60px;display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
.acc-card{position:sticky;top:16px;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px #1e39201a}
.acc-cover{height:96px;background:linear-gradient(135deg,#226347,#5da07f 60%,#f0c36a);position:relative}
.acc-cover:before,.acc-cover:after{content:"";position:absolute;border:2px dashed #ffffff66;border-radius:50%}
.acc-cover:before{width:120px;height:120px;right:-30px;top:-50px}.acc-cover:after{width:60px;height:60px;left:24px;bottom:-34px}
.acc-body{padding:0 22px 22px;text-align:center}
.acc-avatar{width:84px;height:84px;margin:-42px auto 10px;border-radius:50%;border:5px solid #fff;background:#e6eee2;color:#226347;font-size:34px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px #1e392030;position:relative}
.acc-name{margin:0;font-size:21px;color:var(--ink)}
.acc-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0 14px}
.acc-chip{background:#eef4ec;border:1px solid #d3e0d4;color:#244e3d;border-radius:16px;padding:4px 11px;font-size:12px;font-weight:700}
.acc-chip.warm{background:#fff3dc;border-color:#f0dcae;color:#7a5410}
.acc-info{list-style:none;margin:0;padding:12px 0 0;border-top:1px dashed var(--line);text-align:left;font-size:13.5px}
.acc-info li{display:flex;gap:10px;padding:6px 0;color:var(--ink)}
.acc-info span{flex:0 0 22px;text-align:center}
.acc-info b{font-weight:600;word-break:break-all}
.acc-main{min-width:0}
.acc-tabs{display:flex;gap:6px;background:#eef2ec;border-radius:14px;padding:5px;margin-bottom:16px}
.acc-tabs button{flex:1;border:0;background:transparent;padding:10px 8px;border-radius:10px;font-size:14px;font-weight:700;color:#5c6b63;cursor:pointer}
.acc-tabs button.on{background:#fff;color:#226347;box-shadow:0 2px 8px #1e39201f}
.acc-tabs button[hidden]{display:none}
.acc-sec{display:none}.acc-sec.on{display:block}
.acc-box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.acc-box h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
.acc-box h2 i{font-style:normal;width:30px;height:30px;border-radius:9px;background:#e6eee2;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.acc-box>.muted{margin:0 0 12px;font-size:13px}
.acc-box[hidden]{display:none!important}
.acc-pick{display:flex;gap:10px;margin:8px 0 14px}
.acc-pick label{flex:1;cursor:pointer}
.acc-pick input{position:absolute;opacity:0;pointer-events:none}
.acc-pick span{display:block;text-align:center;padding:14px 8px;border:2px solid var(--line);border-radius:14px;font-weight:700;color:#5c6b63;background:#fafcf9;transition:.15s}
.acc-pick input:checked+span{border-color:#226347;background:#eaf3ec;color:#226347}
.acc-pick input:focus-visible+span{outline:3px solid #226347aa}
.acc-danger{border-color:#e9c5bd;background:#fff8f6}
.acc-danger h2 i{background:#f8dcd6}
.acc-danger .muted{color:#8a4a3f}
.acc-danger button.primary{background:#b3402f}
@media(max-width:820px){.acc{grid-template-columns:1fr}.acc-card{position:static}}
</style></head>
<body>
<header><a class="brand" href="/">re<span>:</span>market<small>CAMPUS EDITION</small></a><nav aria-label="메인 메뉴"><button onclick="location.href='/'">중고거래</button></nav></header>
<main><div class="acc">

  <!-- 왼쪽: 내 프로필 카드 (내 정보 보기) -->
  <aside class="acc-card">
    <div class="acc-cover"></div>
    <div class="acc-body">
      <div class="acc-avatar" id="myAvatar">?</div>
      <h1 class="acc-name" id="myName"></h1>
      <div class="acc-chips">
        <span class="acc-chip" id="myRole"></span>
        <span class="acc-chip warm" id="myStatusChip" hidden></span>
      </div>
      <ul class="acc-info">
        <li id="mySchoolRow"><span>🎓</span><b id="mySchool"></b></li>
        <li id="myStatusRow" hidden><span>📌</span><b id="myStatus"></b></li>
        <li><span>✉️</span><b id="myEmail"></b></li>
        <li><span>📱</span><b id="myPhone"></b></li>
      </ul>
    </div>
  </aside>

  <!-- 오른쪽: 설정 (탭으로 나눔) -->
  <section class="acc-main">
    <div class="acc-tabs" role="tablist">
      <button type="button" class="on" data-tab="profile">프로필</button>
      <button type="button" data-tab="security">보안</button>
      <button type="button" data-tab="manage" id="manageTab">계정 관리</button>
    </div>

    <!-- 탭 1. 프로필 -->
    <div class="acc-sec on" id="sec-profile">
      <div class="acc-box" id="namePanel">
        <h2><i>✏️</i>닉네임 수정</h2>
        <p class="muted">판매글·커뮤니티에 보이는 이름이에요. 이미 쓴 게시글에는 예전 이름이 남을 수 있어요.</p>
        <form id="nameForm">
          <label class="field">이름(닉네임)<input name="name" required minlength="2" maxlength="20" placeholder="2~20자"></label>
          <button class="primary wide" type="submit">닉네임 저장</button>
        </form>
      </div>

      <div class="acc-box" id="statusPanel">
        <h2><i>🎓</i>재학 상태</h2>
        <p class="muted">졸업하면 "졸업생"으로 바꿔 주세요.</p>
        <form id="statusForm">
          <div class="acc-pick">
            <label><input type="radio" name="studentStatus" value="ENROLLED"><span>📚 재학생</span></label>
            <label><input type="radio" name="studentStatus" value="GRADUATED"><span>🎉 졸업생</span></label>
          </div>
          <button class="primary wide" type="submit">재학 상태 저장</button>
        </form>
      </div>

      <div class="acc-box">
        <h2><i>📱</i>전화번호 수정</h2>
        <p class="muted">거래 연락에 쓰는 번호예요.</p>
        <form id="phoneForm">
          <label class="field">전화번호<input name="phone" required maxlength="13" placeholder="예: 010-1234-5678"></label>
          <button class="primary wide" type="submit">전화번호 저장</button>
        </form>
      </div>
    </div>

    <!-- 탭 2. 보안 -->
    <div class="acc-sec" id="sec-security">
      <div class="acc-box">
        <h2><i>🔒</i>비밀번호 변경</h2>
        <p class="muted">현재 비밀번호를 확인한 뒤 바꿔요. 바꾸면 다시 로그인해야 해요.</p>
        <form id="passwordForm">
          <label class="field">지금 비밀번호<input name="currentPassword" type="password" required maxlength="64" autocomplete="current-password"></label>
          <label class="field">새 비밀번호<input name="newPassword" type="password" required maxlength="64" autocomplete="new-password" placeholder="영문+숫자 8자 이상"></label>
          <label class="field">새 비밀번호 확인<input name="newPassword2" type="password" required maxlength="64" autocomplete="new-password"></label>
          <button class="primary wide" type="submit">비밀번호 변경</button>
        </form>
      </div>
    </div>

    <!-- 탭 3. 계정 관리 (학생만 보임) -->
    <div class="acc-sec" id="sec-manage">
      <div class="acc-box acc-danger" id="withdrawPanel">
        <h2><i>⚠️</i>회원 탈퇴</h2>
        <p class="muted">탈퇴하면 이름·전화번호·이메일이 지워지고 다시 로그인할 수 없어요. 같은 학번으로는 다시 가입할 수 없어요.</p>
        <form id="withdrawForm">
          <label class="field">비밀번호 확인<input name="password" type="password" required maxlength="64" autocomplete="current-password"></label>
          <label style="display:block;margin:10px 0"><input name="agree" type="checkbox" required> 위 내용을 확인했고 탈퇴할게요.</label>
          <button class="primary wide" type="submit">회원 탈퇴</button>
        </form>
      </div>
    </div>
  </section>

</div></main>
<div id="toast" role="status"></div>
<script src="/account-security.js?v=20261105-merge"></script>
<script src="member.js?v=20261103-mypage"></script>
<script src="mypage.js?v=20261105"></script>
</body></html>
