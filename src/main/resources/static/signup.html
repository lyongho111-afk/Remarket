<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>회원가입 · 캠퍼스 리마켓</title><link rel="stylesheet" href="style.css"><script src="/account-security.js?v=20261104"></script></head>
<body>
<header><a class="brand" href="/">re<span>:</span>market<small>CAMPUS EDITION</small></a></header>
<main><div style="max-width:520px;margin:0 auto;padding:10px 0 60px">
  <div class="panel">
    <span class="eyebrow">JOIN YOUR CAMPUS</span>
    <h2>캠퍼스 리마켓 회원가입</h2>
    <p>가입 유형을 먼저 선택해 주세요.</p>

    <!-- 가입 유형 선택 (중고거래 카테고리 버튼과 같은 모양) -->
    <div class="categories" role="tablist" style="margin:6px 0 4px">
      <button type="button" class="selected" data-type="student">🎓 일반회원 (학생)</button>
      <button type="button" data-type="owner">🏪 사장님</button>
    </div>

    <!-- ===== 일반회원(학생) ===== -->
    <form id="signupForm">
      <label class="field">학교
        <select name="schoolId" id="schoolSelect" required><option value="">학교를 선택해 주세요</option></select>
      </label>

      <label class="field">학교 웹메일
        <span style="display:flex;gap:8px;margin-top:7px">
          <input name="email" type="email" required maxlength="100" autocomplete="email" placeholder="학번@inha.edu" style="margin-top:0">
          <button type="button" id="sendCode" class="tag" style="white-space:nowrap;padding:0 14px;font-size:12px">인증번호 받기</button>
        </span>
      </label>
      <div id="codeBox" hidden>
        <label class="field">인증번호 6자리
          <span style="display:flex;gap:8px;margin-top:7px">
            <input name="code" inputmode="numeric" maxlength="6" placeholder="000000" style="margin-top:0">
            <button type="button" id="verifyCode" class="tag" style="white-space:nowrap;padding:0 14px;font-size:12px">확인</button>
          </span>
        </label>
        <p id="devCode" class="demo-label" hidden></p>
      </div>
      <p id="verified" class="tag" hidden>✓ 이메일 인증 완료</p>

      <label class="field">학번 <small class="muted">(로그인 아이디로 사용)</small><input name="studentNo" required inputmode="numeric" maxlength="10" placeholder="예: 20261234"></label>
      <label class="field">비밀번호<input name="password" type="password" required minlength="8" maxlength="64" autocomplete="new-password" placeholder="영문과 숫자를 섞어 8자 이상"></label>
      <label class="field">비밀번호 확인<input name="password2" type="password" required maxlength="64" autocomplete="new-password"></label>
      <label class="field">이름<input name="name" required maxlength="20" autocomplete="name"></label>
      <label class="field">전화번호<input name="phone" required maxlength="13" inputmode="tel" autocomplete="tel" placeholder="010-1234-5678"></label>

      <div style="margin:17px 0;font-size:12px;font-weight:700">학적 <!-- .field를 쓰면 라디오 버튼까지 100% 너비가 돼서 따로 지정 -->
        <label class="slot"><input type="radio" name="studentStatus" value="ENROLLED" checked> 재학생</label>
        <label class="slot"><input type="radio" name="studentStatus" value="GRADUATED"> 졸업생 <small class="muted">(선배 꿀팁 작성 예정)</small></label>
      </div>

      <button class="primary wide" type="submit" id="signupButton" disabled>가입하기</button>
    </form>

    <!-- ===== 사장님 (2단계: 계정 → 가게) ===== -->
    <form id="ownerForm" hidden>
      <p class="tag" id="ownerStepLabel" style="display:inline-block;margin-top:14px">1 / 2 · 계정 정보</p>

      <!-- 1단계: 계정 -->
      <div id="ownerStep1">
        <label class="field">아이디 <small class="muted">(영어 소문자·숫자 4~20자)</small><input name="loginId" required maxlength="20" autocomplete="username" placeholder="예: cafe_hana"></label>
        <label class="field">비밀번호<input name="password" type="password" required minlength="8" maxlength="64" autocomplete="new-password" placeholder="영문과 숫자를 섞어 8자 이상"></label>
        <label class="field">비밀번호 확인<input name="password2" type="password" required maxlength="64" autocomplete="new-password"></label>
        <label class="field">대표자 이름<input name="name" required maxlength="20" autocomplete="name"></label>
        <label class="field">대표자 전화번호<input name="phone" required maxlength="13" inputmode="tel" autocomplete="tel" placeholder="010-1234-5678"></label>
        <label class="field">이메일<input name="email" type="email" required maxlength="100" autocomplete="email" placeholder="example@email.com"></label>
        <label class="field">사업자등록번호<input name="businessNo" required maxlength="12" inputmode="numeric" placeholder="123-45-67890"></label>
        <button class="primary wide" type="button" id="ownerNext">다음 · 가게 정보 입력 →</button>
      </div>

      <!-- 2단계: 가게 (숨겨진 칸에 required가 있으면 제출이 막혀서, 필수 검사는 JS·서버에서) -->
      <div id="ownerStep2" hidden>
        <label class="field">상호<input name="shopname" maxlength="50" placeholder="예: 정문 카페, 한 잔"></label>
        <label class="field">업종
          <select name="busiKind">
            <option value="">업종을 선택해 주세요</option>
            <option>카페</option><option>음식점</option><option>주점</option>
            <option>스터디카페</option><option>인쇄·문구</option><option>기타</option>
          </select>
        </label>
        <label class="field">가게 전화번호 <small class="muted">(선택)</small><input name="shopphone" maxlength="13" inputmode="tel" placeholder="032-123-4567"></label>

        <label class="field">가게 주소
          <span style="display:flex;gap:8px;margin-top:7px">
            <input name="address" maxlength="150" placeholder="주소 검색을 눌러 주세요" style="margin-top:0">
            <button type="button" id="addressSearch" class="tag" style="white-space:nowrap;padding:0 14px;font-size:12px">주소 검색</button>
          </span>
        </label>
        <label class="field">상세 주소 <small class="muted">(선택)</small><input name="addressDetail" maxlength="50" placeholder="예: 1층 101호"></label>

        <label class="field">영업시간 <small class="muted">(선택)</small><input name="busitime" maxlength="20" placeholder="예: 10:00~22:00"></label>
        <label class="field">휴무일 <small class="muted">(선택)</small><input name="offday" maxlength="20" placeholder="예: 매주 일요일"></label>
        <label class="field">대표 메뉴 <small class="muted">(선택)</small><textarea name="bmenu" maxlength="400" placeholder="예: 아메리카노 2,500원, 카페라떼 3,000원"></textarea></label>

        <label class="field">상점 사진 <small class="muted">(선택 · 5MB 이하 jpg/png/webp/gif)</small>
          <input name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
        </label>
        <img id="photoPreview" alt="상점 사진 미리보기" hidden style="width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:4px">

        <p class="demo-label">가입하면 관리자 확인 전까지 <b>승인 대기</b> 상태예요. 매니저는 가입 후 로그인해서 <b>매니저 관리</b> 화면에서 등록해요.</p>
        <div style="display:flex;gap:10px">
          <button type="button" id="ownerPrev" class="tag" style="padding:0 18px">← 이전</button>
          <button class="primary" type="submit" style="flex:1">사장님으로 가입하기</button>
        </div>
      </div>
    </form>

    <p class="muted" style="text-align:center;margin-top:22px">이미 회원이신가요? <a href="login.html" style="color:var(--green);font-weight:700">로그인 →</a></p>
  </div>
</div></main>
<div id="toast" role="status"></div>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script> <!-- 카카오(다음) 우편번호 검색 (API 키 없이 무료) -->
<script src="member.js?v=20261102-login"></script>
</body></html>
