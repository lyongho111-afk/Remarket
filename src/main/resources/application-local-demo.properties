# Isolated, disposable local demo: never use an existing database with this profile.
#server.address=127.0.0.1
#server.port=8091
#spring.datasource.url=jdbc:h2:mem:campus_local_demo;MODE=MySQL;DB_CLOSE_DELAY=-1
#spring.sql.init.mode=always
#spring.jpa.hibernate.ddl-auto=create
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 배포 환경에 맞게 DDL 설정 (기존 데이터 유지 시 update, 초기화 시 create 등)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

spring.h2.console.enabled=false
server.forward-headers-strategy=none
# The JavaMailSender is replaced with an in-memory mailbox; no SMTP is contacted.
spring.mail.host=local-demo.invalid
spring.mail.port=1
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
campus.notifications.mail-from=local-test@campus.test
campus.notifications.enabled=true
campus.notifications.solapi-key=
campus.notifications.solapi-secret=
campus.notifications.sms-from=
campus.notifications.kakao-pf-id=
campus.notifications.kakao-template-id=
campus.geocoding.kakao-key=
