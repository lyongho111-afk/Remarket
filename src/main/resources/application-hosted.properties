# Single application instance with a durable volume shared by database and uploads.
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 배포 환경에 맞게 DDL 설정 (기존 데이터 유지 시 update, 초기화 시 create 등)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8


#spring.datasource.url=jdbc:h2:file:${CAMPUS_STORAGE_DIR:./storage}/db/campus;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
#spring.datasource.username=${CAMPUS_DB_USER:campus}
#spring.datasource.password=${CAMPUS_DB_PASSWORD}
#spring.jpa.hibernate.ddl-auto=update
#spring.sql.init.data-locations=classpath:hosted-reference-data.sql
spring.h2.console.enabled=false
server.error.include-message=never
campus.upload-dir=${CAMPUS_STORAGE_DIR:./storage}/uploads
campus.demo-campus.enabled=false
campus.seed-example-members=false
campus.demo-sellers.enabled=false
campus.shops.seed-selected=false
campus.shops.seed-campus-20261106=false
campus.portal.seed-demo-shop=false
campus.mail.mock=false
