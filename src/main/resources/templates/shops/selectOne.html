<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가게 상세 · 캠퍼스 리마켓</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" href="/preview/shops.css?v=20261110-shop-photos"></head><body><nav th:replace="~{common/nav :: navigation}"></nav><main><h1>가게 상세</h1>
<figure th:if="${photo != null}" class="shop-detail-photo">
  <img th:src="@{/api/shops/photo/{name}(name=${photo})}" th:alt="${dto.shopname + (#strings.startsWith(photo, 'menu-') ? ' 메뉴 참고 사진' : ' 등록 사진')}">
  <figcaption th:if="${#strings.startsWith(photo, 'menu-')}">메뉴 참고 사진 ·
    <a th:href="${'/preview/shop-photo-credits.html#' + #strings.substringBefore(photo, '.jpg')}" target="_blank" rel="noopener">사진 출처</a>
  </figcaption>
</figure><dl><dt>가게명</dt><dd th:text="${dto.shopname}"></dd><dt>전화</dt><dd th:text="${dto.shopphone}"></dd><dt>업종</dt><dd th:text="${dto.busiKind}"></dd><dt>메뉴</dt><dd th:text="${dto.bmenu}"></dd><dt>예약</dt><dd th:text="${dto.reservtime}"></dd><dt>영업시간</dt><dd th:text="${dto.busitime}"></dd><dt>휴일</dt><dd th:text="${dto.offday}"></dd><dt>이벤트</dt><dd th:text="${dto.specialevent}"></dd><dt>형태</dt><dd th:text="${dto.sizeandtype}"></dd><dt>상태 (영업중/혼잡/영업종료/휴무)</dt><dd th:text="${dto.status}"></dd><dt>현재 여유 공간</dt><dd th:text="${dto.availablespace}"></dd></dl><div class="actions"><a class="button" href="/sales/selectAll#shops">가게 지도·목록으로 돌아가기</a></div></main></body></html>
