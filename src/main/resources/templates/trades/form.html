<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>거래 예약</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav th:replace="~{common/nav :: navigation}"></nav><main><h1>거래 예약</h1><p th:text="${sale.name}"></p><p>서버가 현재 가격 <b th:text="${sale.currentPrice}"></b>원을 약속 가격으로 저장합니다.</p><form class="box" method="post" th:action="@{/trades/insert}" th:object="${dto}"><input type="hidden" th:field="*{selno}"><input type="hidden" name="requestKey" th:value="${requestKey}"><label>약속 장소<input th:field="*{meetingPlace}" maxlength="150"></label><label>약속 시간<input type="datetime-local" th:field="*{meetingTime}"></label><button>현재 가격으로 예약</button></form></main><script>
const form = document.querySelector('form.box');
form.addEventListener('submit', event => {
  if (form.dataset.busy) { event.preventDefault(); return; }
  form.dataset.busy = 'true';
  form.querySelector('button').disabled = true;
});
window.addEventListener('pageshow', () => {
  delete form.dataset.busy;
  form.querySelector('button').disabled = false;
});
</script></body></html>
