<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>거래 목록</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav th:replace="~{common/nav :: navigation}"></nav><main><h1>거래 기록</h1><p>약속 가격은 상품 가격과 별도로 보존합니다. 실결제와는 연결되지 않은 학습용 데이터입니다.</p><div class="table-wrap"><table><tr><th>주문번호</th><th>상품</th><th>구매자</th><th>약속 가격</th><th>상태</th></tr><tr th:each="dto : ${list}"><td><a th:href="@{/trades/selectOne(id=${dto.orderId})}" th:text="${dto.orderId}"></a></td><td th:text="${dto.saleName}"></td><td th:text="${dto.buyer}"></td><td th:text="${dto.agreedPrice}"></td><td th:text="${dto.status}"></td></tr></table></div></main></body></html>
