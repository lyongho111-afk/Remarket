<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>판매글 목록 · 캠퍼스 리마켓</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav th:replace="~{common/nav :: navigation}"></nav><main><p class="eyebrow">CAMPUS RE:MARKET · SALES</p><h1>판매글 목록</h1><p>실제 H2 데이터베이스를 XML Mapper로 조회한 결과입니다.</p><a class="button" href="/sales/insert">＋ 판매글 등록</a><div class="table-wrap"><table><thead><tr><th>번호</th><th>상품명</th><th>할인 전 표시가</th><th>현재 조회 가격</th><th>할인율</th><th>상태</th><th>관리</th></tr></thead><tbody><tr th:each="dto : ${list}"><td th:text="${dto.selno}"></td><td th:text="${dto.name}"></td><td th:text="${dto.oprice}"></td><td th:text="${dto.currentPrice}"></td><td th:text="${dto.discount}"></td><td th:text="${dto.status}"></td><td><a th:href="@{/sales/selectOne(id=${dto.selno})}">상세</a> · <a th:href="@{/sales/update(id=${dto.selno})}">수정</a></td></tr></tbody></table></div><p class="note" th:if="${#lists.isEmpty(list)}">등록된 자료가 없습니다.</p></main></body></html>
