<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>판매글 상세 · 캠퍼스 리마켓</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav th:replace="~{common/nav :: navigation}"></nav><main><h1>판매글 상세</h1><dl><dt>판매자 ID</dt><dd th:text="${dto.seller}"></dd><dt>카테고리</dt><dd th:text="${dto.category}"></dd><dt>상품명</dt><dd th:text="${dto.name}"></dd><dt>할인 전 표시가 (원)</dt><dd th:text="${dto.oprice}"></dd><dt>구입 원가 (선택)</dt><dd th:text="${dto.buyprice}"></dd><dt>희망 매가 (선택)</dt><dd th:text="${dto.wishprice}"></dd><dt>상품 설명</dt><dd th:text="${dto.detail}"></dd><dt>거래 지역</dt><dd th:text="${dto.location}"></dd><dt>사진 1 URL (선택)</dt><dd th:text="${dto.photo1}"></dd><dt>사진 2 URL (선택)</dt><dd th:text="${dto.photo2}"></dd><dt>사진 3 URL (선택)</dt><dd th:text="${dto.photo3}"></dd></dl><section class="box"><h2>24시간 할인</h2><p>기존 표시가 <b th:text="${dto.oprice}"></b>원 / 현재 조회 가격 <b th:text="${dto.currentPrice}"></b>원</p><form method="post" th:action="@{/sales/discount}"><input type="hidden" name="selno" th:value="${dto.selno}"><label>할인율(%)<input type="number" name="rate" min="1" max="99" step="1" required id="discount-rate"></label><p id="discount-result">할인율을 입력하면 판매가를 계산합니다.</p><button>24시간 할인 시작</button></form><form method="post" action="/sales/discountEnd"><input type="hidden" name="selno" th:value="${dto.selno}"><button>할인 종료</button></form><form method="post" action="/sales/bump"><input type="hidden" name="selno" th:value="${dto.selno}"><button>끌어올리기</button></form><a class="button" th:href="@{/trades/insert(selno=${dto.selno})}">이 가격으로 거래 예약</a></section><script th:inline="javascript">const base=/*[[${dto.oprice}]]*/0;document.querySelector('#discount-rate').oninput=e=>{const rate=Number(e.target.value);document.querySelector('#discount-result').textContent=rate>=1&&rate<=99?'할인 후 '+Math.floor(base*(100-rate)/100).toLocaleString('ko-KR')+'원':'1~99%를 입력하세요.';};</script><div class="actions"><a class="button" href="/sales/selectAll">목록</a><a class="button" th:href="@{/sales/update(id=${dto.selno})}">수정</a><form method="post" action="/sales/delete"><input type="hidden" name="id" th:value="${dto.selno}"><button class="danger">삭제</button></form></div></main></body></html>
