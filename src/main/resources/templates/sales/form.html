<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>판매글 등록·수정 · 캠퍼스 리마켓</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav th:replace="~{common/nav :: navigation}"></nav><main><h1 th:text="${editing ? '판매글 수정' : '판매글 등록'}"></h1><form class="box edit-form" method="post" th:object="${dto}" th:action="@{/sales/{action}(action=${editing ? 'update' : 'insert'})}"><input type="hidden" th:field="*{selno}"><label>판매자 ID<input type="text" th:field="*{seller}" maxlength="50"></label><label>카테고리<input type="text" th:field="*{category}" maxlength="50"></label><label>상품명<input type="text" th:field="*{name}" maxlength="150"></label><label>할인 전 표시가 (원)<input type="number" th:field="*{oprice}" min="0" step="1" max="99999999"></label><label>구입 원가 (선택)<input type="number" th:field="*{buyprice}" min="0" step="1" max="99999999"></label><label>희망 매가 (선택)<input type="number" th:field="*{wishprice}" min="0" step="1" max="99999999"></label><label>상품 설명<textarea th:field="*{detail}" maxlength="1500"></textarea></label><label>거래 지역<input type="text" th:field="*{location}" maxlength="50"></label><label>사진 1 URL (선택)<input type="text" th:field="*{photo1}" maxlength="500"></label><label>사진 2 URL (선택)<input type="text" th:field="*{photo2}" maxlength="500"></label><label>사진 3 URL (선택)<input type="text" th:field="*{photo3}" maxlength="500"></label><button type="submit">저장</button><a href="/sales/selectAll">취소</a></form></main></body></html>
