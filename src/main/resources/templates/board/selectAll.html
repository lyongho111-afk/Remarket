<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게시글 목록 · 캠퍼스 리마켓</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav th:replace="~{common/nav :: navigation}"></nav><main><p class="eyebrow">CAMPUS RE:MARKET · BOARD</p><h1>게시글 목록</h1><p>실제 H2 데이터베이스를 XML Mapper로 조회한 결과입니다.</p><a class="button" href="/board/insert">＋ 게시글 등록</a><div class="table-wrap"><table><thead><tr><th>번호</th><th>분류</th><th>제목</th><th>작성자</th><th>관리</th></tr></thead><tbody><tr th:each="dto : ${list}"><td th:text="${dto.postId}"></td><td th:text="${dto.categoryName}"></td><td th:text="${dto.title}"></td><td th:text="${dto.writer}"></td><td><a th:href="@{/board/selectOne(id=${dto.postId})}">상세</a> · <a th:href="@{/board/update(id=${dto.postId})}">수정</a></td></tr></tbody></table></div><p class="note" th:if="${#lists.isEmpty(list)}">등록된 자료가 없습니다.</p></main></body></html>
