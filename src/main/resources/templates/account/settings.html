<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 정보 · 비밀번호 변경 | 캠퍼스 리마켓</title><link rel="stylesheet" href="/account-settings.css"><script src="/account-security.js"></script></head><body><main class="account-panel"><a href="/sales/selectAll#profile">← 마이페이지</a><p class="eyebrow">MY ACCOUNT</p><h1>내 정보</h1><p id="my-account-name">로그인 정보를 확인하고 있어요.</p><h2>비밀번호 변경</h2><p>현재 비밀번호를 확인한 뒤 새 비밀번호로 변경합니다.</p><form id="password-change"><label>현재 비밀번호<input type="password" name="oldPassword" autocomplete="current-password" required></label><label>새 비밀번호<input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="64" placeholder="영문·숫자를 포함한 8~64자" required></label><label>새 비밀번호 확인<input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" maxlength="64" required></label><button class="primary" type="submit">비밀번호 변경</button></form><p id="password-status" role="status" aria-live="polite"></p><a id="account-back" href="/">학생 페이지로 돌아가기</a></main><script src="/account-settings.js"></script></body></html>
