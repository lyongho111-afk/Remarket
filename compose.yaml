services:
  app:
    build: .
    restart: unless-stopped
    environment:
      CAMPUS_DB_PASSWORD: ${CAMPUS_DB_PASSWORD:?Set CAMPUS_DB_PASSWORD in .env}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      TOSS_PAYMENT_MODE: ${TOSS_PAYMENT_MODE:-TEST}
      ENABLE_LIVE_PAYMENTS: ${ENABLE_LIVE_PAYMENTS:-false}
      TOSS_TEST_ESCROW_ENABLED: ${TOSS_TEST_ESCROW_ENABLED:-false}
      TOSS_TEST_PAYOUT_LOOKUP_ENABLED: ${TOSS_TEST_PAYOUT_LOOKUP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - campus_data:/var/lib/campus
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      CAMPUS_DOMAIN: ${CAMPUS_DOMAIN:?Set the public hostname in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  campus_data:
  caddy_data:
  caddy_config:
